<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parejas de Pádel</title>
<meta name="description" content="Escribe 4 nombres y una ruleta forma dos parejas de pádel al azar.">
<meta property="og:title" content="Parejas de Pádel">
<meta property="og:description" content="Escribe 4 nombres y una ruleta forma dos parejas de pádel al azar.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pádel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23d6ef3a'/%3E%3Cpath d='M10 18c14 6 14 22 0 28M54 18c-14 6-14 22 0 28' fill='none' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url(fonts/barlow-400.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url(fonts/barlow-600.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/barlow-condensed-600.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-display: swap; src: url(fonts/barlow-condensed-800.woff2) format("woff2"); }

  /* Layout: mobile-first single column. Names on top, big button, then a padel court with one pair on each side of the net. */
  :root {
    --bg: #eef3f8;
    --surface: #ffffff;
    --fg: #10233a;
    --muted: #5a6b80;
    --line: #d3dde8;
    --court: #1f5fa8;
    --court-line: #ffffff;
    --ball: #d6ef3a;
    --ball-ink: #1b2a06;
    --focus: #1f5fa8;
    --error: #c0392b;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1622; --surface: #142233; --fg: #e8eff7; --muted: #9fb0c4; --line: #26384d;
      --court: #2a6dbd; --court-line: #e8eff7; --focus: #d6ef3a; --error: #ff8a7a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { touch-action: manipulation; }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    display: grid;
    gap: 18px;
  }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .titles { display: grid; gap: 2px; min-width: 0; }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2rem, 9vw, 2.6rem);
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
  }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .sound {
    flex: none;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    min-height: 40px;
    padding: 6px 14px;
    cursor: pointer;
  }

  form { display: grid; gap: 14px; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: grid; gap: 3px; min-width: 0; }
  .field label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field input {
    font: inherit;
    font-size: 17px; /* 16px+ stops iOS from zooming on focus */
    color: var(--fg);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    min-height: 48px;
    padding: 10px 12px;
    width: 100%;
  }
  .field input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: transparent; }

  .go {
    width: 100%;
    min-height: 56px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: 0;
    border-radius: 999px;
    padding: 12px 28px;
    cursor: pointer;
    background: var(--ball);
    color: var(--ball-ink);
    box-shadow: 0 3px 0 rgba(27, 42, 6, 0.25);
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(27, 42, 6, 0.25); }
  .go:disabled { opacity: 0.55; cursor: progress; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .error { color: var(--error); font-weight: 600; margin: 0; }

  .status {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.5rem;
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-align: center;
    margin: 4px 0 -6px;
    min-height: 2.2em; /* room for two lines, so the court does not jump */
    display: grid;
    place-items: center;
    scroll-margin-top: calc(12px + env(safe-area-inset-top));
  }
  .status.pulse { animation: pulse 0.6s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.55; } to { opacity: 1; } }

  /* Court */
  .court-wrap { position: relative; }
  .court { background: var(--court); border-radius: 6px; padding: 12px; color: #fff; }
  .court.shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: none; }
    25% { transform: translateX(-5px) rotate(-0.4deg); }
    60% { transform: translateX(5px) rotate(0.4deg); }
  }
  .court-inner {
    position: relative;
    border: 3px solid var(--court-line);
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    min-height: min(340px, 62vw + 60px);
  }
  .half { position: relative; display: grid; place-items: center; padding: 16px 8px; }
  .half::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    border-top: 2px solid var(--court-line);
    opacity: 0.85;
  }
  .half::after {
    content: "";
    position: absolute;
    left: 50%;
    border-left: 2px solid var(--court-line);
    opacity: 0.85;
  }
  .half.top::before { bottom: 30%; }
  .half.top::after { bottom: 0; height: 30%; }
  .half.bottom::before { top: 30%; }
  .half.bottom::after { top: 0; height: 30%; }

  .net {
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--court-line) 0 4px, transparent 4px 8px);
    position: relative;
  }
  .net span {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--ball);
    color: var(--ball-ink);
    font-family: var(--display);
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 0.08em;
    padding: 2px 12px;
    border-radius: 999px;
  }
  .net span.boom { animation: boom 0.5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes boom { from { transform: translate(-50%, -50%) scale(2.4); } to { transform: translate(-50%, -50%) scale(1); } }

  .pair {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 4px;
    text-align: center;
    background: rgba(10, 30, 60, 0.55);
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 100%;
  }
  .pair-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .pair-names {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2px 6px;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(1.5rem, 7vw, 1.9rem);
    line-height: 1.1;
  }
  .amp { color: var(--ball); }

  /* A slot is one name. While spinning it looks like a slot-machine reel. */
  .slot {
    display: inline-block;
    min-width: 4.5ch;
    padding: 0 6px;
    border-radius: 6px;
    overflow-wrap: anywhere;
  }
  .slot.spinning {
    background: rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 0 2px var(--ball);
    filter: blur(0.6px);
  }
  .slot.empty { color: rgba(255, 255, 255, 0.45); }
  .slot.locked { animation: lock 0.45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes lock {
    0% { transform: scale(1.5); color: var(--ball); }
    100% { transform: scale(1); }
  }

  .fx {
    position: absolute;
    left: 0; top: -40px;
    width: 100%;
    height: calc(100% + 40px);
    pointer-events: none;
    z-index: 2;
  }

  .note { margin: 0; color: var(--muted); font-size: 0.85rem; text-align: center; }

  @media (min-width: 600px) {
    .wrap { padding-top: calc(36px + env(safe-area-inset-top)); gap: 22px; }
    .go { width: auto; justify-self: start; }
    .status { text-align: left; place-items: center start; }
    .note { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status.pulse, .court.shake, .net span.boom, .slot.locked { animation: none; }
    .go { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>Parejas de Pádel</h1>
      <p>Escribe 4 nombres. La ruleta decide.</p>
    </div>
    <button type="button" class="sound" id="sound" aria-pressed="true">🔊 Sí</button>
  </header>

  <form id="form" novalidate>
    <div class="names">
      <div class="field"><label for="p1">Jugador 1</label><input id="p1" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="20" value="Ana"></div>
      <div class="field"><label for="p2">Jugador 2</label><input id="p2" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="20" value="Carlos"></div>
      <div class="field"><label for="p3">Jugador 3</label><input id="p3" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="20" value="Lucía"></div>
      <div class="field"><label for="p4">Jugador 4</label><input id="p4" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="20" value="Javi"></div>
    </div>
    <p class="error" id="error" role="alert" hidden></p>
    <button type="submit" class="go" id="go">Sortear parejas</button>
  </form>

  <p class="status" id="status" aria-live="polite">Pulsa el botón para sortear</p>

  <div class="court-wrap">
    <section class="court" id="court" aria-label="Pista">
      <div class="court-inner">
        <div class="half top">
          <div class="pair">
            <span class="pair-label">Pareja A</span>
            <span class="pair-names"><span class="slot empty" id="s0">?</span><span class="amp">&amp;</span><span class="slot empty" id="s1">?</span></span>
          </div>
        </div>
        <div class="net"><span id="vs">VS</span></div>
        <div class="half bottom">
          <div class="pair">
            <span class="pair-label">Pareja B</span>
            <span class="pair-names"><span class="slot empty" id="s2">?</span><span class="amp">&amp;</span><span class="slot empty" id="s3">?</span></span>
          </div>
        </div>
      </div>
    </section>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  </div>

  <p class="note">Con 4 jugadores hay 3 combinaciones posibles. Cada sorteo da una distinta a la anterior. Los nombres solo se guardan en este móvil.</p>
</div>

<script>
  const $ = id => document.getElementById(id);
  const inputs = ["p1", "p2", "p3", "p4"].map($);
  const slots = ["s0", "s1", "s2", "s3"].map($);
  const goBtn = $("go"), soundBtn = $("sound"), statusEl = $("status"), errorEl = $("error");
  const court = $("court"), vs = $("vs"), canvas = $("fx");
  const KEY = "padel-names", SOUND_KEY = "padel-sound";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The 3 possible ways to split 4 players into 2 pairs (by index).
  const SPLITS = [
    [[0, 1], [2, 3]],
    [[0, 2], [1, 3]],
    [[0, 3], [1, 2]],
  ];
  let last = -1;
  let busy = false;

  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (Array.isArray(saved) && saved.length === 4) saved.forEach((n, i) => { if (n) inputs[i].value = n; });
  } catch (e) {}

  // "Next" on the phone keyboard jumps to the next name; the last one starts the draw.
  inputs.forEach((input, i) => {
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && i < 3) { e.preventDefault(); inputs[i + 1].focus(); }
    });
  });

  /* ---------- Sound (tiny beeps made with Web Audio, no files) ---------- */
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) {}
  function paintSound() {
    soundBtn.textContent = soundOn ? "🔊 Sí" : "🔇 No";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.setAttribute("aria-label", soundOn ? "Sonido activado" : "Sonido desactivado");
  }
  paintSound();
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    paintSound();
    if (soundOn) unlockAudio();
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
  });

  let actx = null;
  // Phones only allow audio that starts from a tap, so create/resume it inside the tap handler.
  function unlockAudio() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) {}
  }
  function beep(freq, dur = 0.05, type = "square", vol = 0.05) {
    if (!soundOn || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const tick = () => beep(900 + Math.random() * 300, 0.03);
  const thud = () => { beep(220, 0.18, "triangle", 0.12); beep(330, 0.18, "triangle", 0.06); buzz(30); };
  function fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.09), i * 110));
    buzz([60, 40, 60, 40, 120]);
  }

  /* ---------- Slot helpers ---------- */
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function setSlot(el, text, state) {
    el.textContent = text;
    el.className = "slot" + (state ? " " + state : "");
  }

  function lock(el, name) {
    setSlot(el, name, "");
    void el.offsetWidth;
    el.classList.add("locked");
    thud();
  }

  // Spin a set of slots through the given names, slowing down until `duration` ms.
  async function spin(els, pool, duration) {
    const start = performance.now();
    let i = Math.floor(Math.random() * pool.length);
    els.forEach(el => setSlot(el, pool[i % pool.length], "spinning"));
    while (true) {
      const t = (performance.now() - start) / duration;
      if (t >= 1) break;
      i++;
      els.forEach((el, k) => setSlot(el, pool[(i + k) % pool.length], "spinning"));
      tick();
      await wait(45 + 330 * t * t); // fast at first, slow at the end
    }
  }

  function bump(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ---------- Confetti of padel balls ---------- */
  function confetti() {
    if (reduced) return;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const balls = Array.from({ length: 32 }, () => ({
      x: w / 2 + (Math.random() - 0.5) * 60,
      y: h * 0.55,
      vx: (Math.random() - 0.5) * (w / 45),
      vy: -6 - Math.random() * 8,
      r: 5 + Math.random() * 6,
      rot: Math.random() * Math.PI,
    }));
    const start = performance.now();
    function frame(now) {
      const t = now - start;
      ctx.clearRect(0, 0, w, h);
      balls.forEach(b => {
        b.vy += 0.35; b.x += b.vx; b.y += b.vy; b.rot += 0.1;
        if (b.y > h - b.r && b.vy > 0) { b.y = h - b.r; b.vy *= -0.55; b.vx *= 0.8; }
        if (b.x < b.r || b.x > w - b.r) b.vx *= -1;
        ctx.globalAlpha = Math.max(0, 1 - t / 2200);
        ctx.fillStyle = "#d6ef3a";
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.75, b.rot, b.rot + Math.PI * 0.7); ctx.stroke();
      });
      if (t < 2200) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- The draw ---------- */
  function readNames() {
    const names = inputs.map(i => i.value.trim());
    const missing = names.findIndex(n => !n);
    if (missing !== -1) {
      errorEl.textContent = "Falta el nombre del jugador " + (missing + 1) + ".";
      errorEl.hidden = false;
      inputs[missing].focus();
      return null;
    }
    if (new Set(names.map(n => n.toLowerCase())).size < 4) {
      errorEl.textContent = "Hay nombres repetidos. Usa 4 nombres distintos.";
      errorEl.hidden = false;
      return null;
    }
    errorEl.hidden = true;
    return names;
  }

  async function draw() {
    if (busy) return;
    const names = readNames();
    if (!names) return;
    try { localStorage.setItem(KEY, JSON.stringify(names)); } catch (e) {}

    // Close the phone keyboard and bring the court into view.
    if (document.activeElement) document.activeElement.blur();
    setTimeout(() => statusEl.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" }), 80);

    // Decide the result first, then put on the show.
    let pick;
    do { pick = Math.floor(Math.random() * 3); } while (pick === last);
    last = pick;
    let [a, b] = SPLITS[pick];
    if (Math.random() < 0.5) [a, b] = [b, a];
    if (Math.random() < 0.5) a = [a[1], a[0]];
    if (Math.random() < 0.5) b = [b[1], b[0]];
    const result = [names[a[0]], names[a[1]], names[b[0]], names[b[1]]];

    if (reduced) {
      slots.forEach((s, i) => setSlot(s, result[i], ""));
      statusEl.textContent = "¡Partido!";
      goBtn.textContent = "Otra vez";
      return;
    }

    busy = true;
    goBtn.disabled = true;
    statusEl.classList.add("pulse");

    // 1. Everything spins.
    statusEl.textContent = "Girando la ruleta…";
    slots.forEach(s => setSlot(s, "?", "empty"));
    await spin([slots[0]], names, 1300);
    lock(slots[0], result[0]);
    bump(court, "shake");

    // 2. The big moment: who plays with the first player?
    statusEl.textContent = "¿Con quién juega " + result[0] + "?";
    await wait(500);
    const others = names.filter(n => n !== result[0]);
    await spin([slots[1]], others, 2600);
    lock(slots[1], result[1]);
    bump(court, "shake");
    await wait(450);

    // 3. The rivals.
    statusEl.textContent = "Y sus rivales son…";
    await spin([slots[2], slots[3]], [result[2], result[3]], 1100);
    lock(slots[2], result[2]);
    lock(slots[3], result[3]);
    bump(vs, "boom");

    statusEl.classList.remove("pulse");
    statusEl.textContent = "¡Partido!";
    fanfare();
    confetti();

    busy = false;
    goBtn.disabled = false;
    goBtn.textContent = "Otra vez";
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    unlockAudio();
    draw();
  });
</script>
</body>
</html>
